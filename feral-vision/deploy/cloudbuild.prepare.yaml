steps:
  - name: ${_ACQUISITION_IMAGE}
    id: acquire-dataset-into-workspace
    env:
      - MAX_EPOCHS=${_MAX_EPOCHS}
      - BATCH_SIZE=${_BATCH_SIZE}
      - DATASET_PAYLOAD_DIR=/workspace/payload
      - DATASET_INPUT_PATH=/workspace/dataset-input.json
  - name: ${_DVC_IMAGE}
    id: publish-dataset-artifact
    env:
      - TRAINING_DATA_BUCKET_URI=${_TRAINING_DATA_BUCKET_URI}
      - DATASET_ARTIFACT_PREFIX=${_DATASET_ARTIFACT_PREFIX}
      - GCS_URI_PREFIX=${_GCS_URI_PREFIX}
      - DATASET_PAYLOAD_DIR=/workspace/payload
      - DATASET_INPUT_PATH=/workspace/dataset-input.json

substitutions:
  _MAX_EPOCHS: "50"
  _BATCH_SIZE: "16"

# Pass the build identity at submit time: gcloud builds submit --service-account=...

options:
  logging: CLOUD_LOGGING_ONLY
