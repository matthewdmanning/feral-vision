steps:
  - name: gcr.io/cloud-builders/docker
    id: build-dvc-image
    entrypoint: bash
    args:
      - -ceu
      - |
        docker build --tag "${_DVC_IMAGE}" --file=feral-vision/deploy/dataset-publisher/Dockerfile .
        docker push "${_DVC_IMAGE}"

images:
  - ${_DVC_IMAGE}

# Pass the build identity at submit time: gcloud builds submit --service-account=...

options:
  logging: CLOUD_LOGGING_ONLY
