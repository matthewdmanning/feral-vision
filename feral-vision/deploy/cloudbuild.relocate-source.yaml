steps:
  - name: gcr.io/cloud-builders/docker
    id: relocate-embedded-source
    entrypoint: bash
    args:
      - -ceu
      - |
        cat > Dockerfile <<'EOF'
        FROM ${_BASE_IMAGE}
        RUN mkdir -p /opt/feral-vision && cp -a /workspace/. /opt/feral-vision/
        WORKDIR /opt/feral-vision/feral-vision
        ENTRYPOINT ["bash", "/opt/feral-vision/feral-vision/scripts/runs/container_train.sh"]
        EOF
        docker build --tag "${_TRAINING_IMAGE}" .
        docker push "${_TRAINING_IMAGE}"

images:
  - ${_TRAINING_IMAGE}

# Pass _BASE_IMAGE (digest-pinned) and _TRAINING_IMAGE with --substitutions.

options:
  logging: CLOUD_LOGGING_ONLY
