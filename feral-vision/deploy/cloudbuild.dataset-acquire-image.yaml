steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=feral-vision/deploy/Dockerfile.dataset-acquire
      - --tag=${_ACQUISITION_IMAGE}
      - .

images:
  - ${_ACQUISITION_IMAGE}

# Pass the build identity at submit time: gcloud builds submit --service-account=...

options:
  logging: CLOUD_LOGGING_ONLY
