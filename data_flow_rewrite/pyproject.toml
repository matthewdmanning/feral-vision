[project]
name = "feral-vision-data-flow-rewrite"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["dvc[gs]==3.67.1", "dvc-data==3.18.2", "PyYAML==6.0.3"]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.14.14"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
