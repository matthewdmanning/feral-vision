steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=feral-vision/deploy/Dockerfile.dataset-acquire
      - --tag=${_ACQUISITION_IMAGE}
      - .

images:
  - ${_ACQUISITION_IMAGE}

serviceAccount: projects/YOUR_PROJECT_ID/serviceAccounts/training-service-account@YOUR_PROJECT_ID.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
