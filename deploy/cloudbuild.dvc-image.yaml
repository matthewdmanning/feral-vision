steps:
  - name: gcr.io/cloud-builders/docker
    id: build-dvc-image
    entrypoint: bash
    args:
      - -ceu
      - |
        docker build --tag "${_DVC_IMAGE}" --file=deploy/Dockerfile.dvc .
        docker push "${_DVC_IMAGE}"

images:
  - ${_DVC_IMAGE}

serviceAccount: projects/cs-poc-kewg0kffb7uwobgq1rex2af/serviceAccounts/feral-vision-ai@cs-poc-kewg0kffb7uwobgq1rex2af.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
