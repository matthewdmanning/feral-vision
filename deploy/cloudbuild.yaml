# Configuration for the manual cloud smoke. Operational steps live in
# scripts/cloud/ and consume these values through scripts/cloud/run.py.
defaults:
  - deploy_schema
  - _self_

substitutions:
  _GCP_PROJECT: feralspotter-f9e51
  _REGION: us-east4
  _REPO: feral-docker
  _BASE_IMAGE_NAME: feral-vision
  _IMAGE_NAME: feral-vision-gcp
  _IMAGE_TAG: smoke

options:
  logging: CLOUD_LOGGING_ONLY
