[project]
name = "sightkit-learn"
version = "0.1.0"
description = "Configurable computer vision training and inference with PyTorch and MLflow."
authors = [
    { name = "Matthew Manning", email = "mattmanningclemson@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "albumentations==2.0.8",
    "dvc==3.67.1",
    "dvc-gs==3.1.0",
    "fastapi==0.161.1",
    "fiftyone==1.22.1",
    "google-api-python-client==2.201.0",
    "huggingface-hub==2.3.0",
    "hydra-core==1.3.7",
    "mlflow==3.17.2",
    "omegaconf==2.3.1",
    "opencv-python==5.0.0.93",
    "torch>=2.12.1",
    "uvicorn==0.54.0",
    "pycocotools==2.0.11",
    "ultralytics==8.4.184",
    "mcp==2.3.0",
    "transformers==5.20.2",
    "torchvision>=0.27.1",
]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["dvc_vm_environ"]

[tool.uv.build-backend]
module-name = ["sightkit_learn", "templates"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["^src/templates/"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/test_train_stage.py --ignore=tests/test_data_config.py"
markers = ["network: calls a live external service (run in full workflows, not fast PR checks)"]
pythonpath = [".", "feral-vision"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"

[dependency-groups]
docs-sphinx = [
    "sphinx==9.1.1",
    "furo==2025.12.19",
    "sphinx-copybutton==0.5.2",
]
dev = [
    "commitizen==4.19.2",
    "coverage==7.17.0",
    "mypy==2.4.0",
    "ruff==0.15.21",
    "types-PyYAML==6.0.12.20260906",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "furo==2025.12.19",
    "dvc-gs==3.1.0",
    "dvc==3.67.1",
    "acquire==3.22",
    "sphinx==9.1.1",
]
