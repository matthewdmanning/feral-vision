name: Training smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trainer-smoke:
    name: Canonical trainer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --group dev
      - name: Exercise the canonical trainer on CPU fixtures
        env:
          PYTHONHASHSEED: "0"
        run: >-
          uv run python -c "import pytest, torch; torch.manual_seed(0);
          raise SystemExit(pytest.main(['tests/test_trainer.py', '-q', '--tb=short']))"
