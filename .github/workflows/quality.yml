name: Quality checks

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON list of Python versions to validate.
        required: false
        type: string
        default: '["3.12"]'
      coverage:
        description: Upload a coverage report for the caller.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --group dev
      - name: Lint and format
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format --check .
      - name: Static type analysis
        run: uv run mypy src
      - name: Tests
        run: >-
          uv run python -m pytest -m "not gpu and not slow" -q --tb=short
          ${{ inputs.coverage && '--cov=src --cov-report=xml' || '' }}
      - name: Upload coverage report
        if: inputs.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7
