name: Quality checks

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON list of Python versions to validate.
        required: false
        type: string
        default: '["3.12"]'
      coverage:
        description: Upload a coverage report for the caller.
        required: false
        type: boolean
        default: false
      base-sha:
        description: Base commit used to find changed Python files.
        required: false
        type: string
        default: ""
      head-sha:
        description: Head commit used to find changed Python files.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --group dev
      - name: Lint and format changed Python files
        run: |
          BASE_SHA="${{ inputs.base-sha }}"
          HEAD_SHA="${{ inputs.head-sha }}"
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            BASE_SHA="HEAD^"
            HEAD_SHA="HEAD"
          fi
          mapfile -t PYTHON_FILES < <(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- '*.py')
          if [ "${#PYTHON_FILES[@]}" -eq 0 ]; then
            echo "No changed Python files to lint or format-check."
            exit 0
          fi
          uv run ruff check "${PYTHON_FILES[@]}" --output-format=github
          uv run ruff format --check "${PYTHON_FILES[@]}"
      - name: Static type analysis
        run: uv run mypy src
      - name: Tests
        run: >-
          uv run python -m pytest -m "not gpu and not slow" -q --tb=short
          ${{ inputs.coverage && '--cov=src --cov-report=xml' || '' }}
      - name: Upload coverage report
        if: inputs.coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.sha }}-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7
