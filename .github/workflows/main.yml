name: Main PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: main-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commit messages
    uses: ./.github/workflows/commit-messages.yml

  quality:
    name: Quality checks
    uses: ./.github/workflows/quality.yml
    with:
      python-versions: '["3.12"]'
      coverage: true

  security:
    name: Security checks
    uses: ./.github/workflows/security.yml

  training-smoke:
    name: Training smoke
    uses: ./.github/workflows/train.yml
