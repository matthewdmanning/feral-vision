name: Docs (main PR)

on:
  # Check proposed documentation and package changes before merging to main.
  pull_request:
    branches: [main]
    paths:
      - "mkdocs.yml"
      - "mkdocs.yaml"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs-build.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect docs builder
        id: detect
        run: |
          if [ -f "mkdocs.yml" ] || [ -f "mkdocs.yaml" ]; then
            echo "builder=mkdocs" >> "$GITHUB_OUTPUT"
          elif [ -f "docs/conf.py" ]; then
            echo "builder=sphinx" >> "$GITHUB_OUTPUT"
          else
            echo "builder=none" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: steps.detect.outputs.builder != 'none'
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        if: steps.detect.outputs.builder != 'none'
        run: |
          if [ "${{ steps.detect.outputs.builder }}" = "mkdocs" ]; then
            uv sync --group dev --group docs-mkdocs
          else
            uv sync --group dev --group docs-sphinx
          fi

      - name: Build docs
        if: steps.detect.outputs.builder != 'none'
        run: |
          if [ "${{ steps.detect.outputs.builder }}" = "mkdocs" ]; then
            uv run mkdocs build --strict
          else
            uv run sphinx-build -b html docs docs/_build -W
          fi

      - name: Package build check
        if: steps.detect.outputs.builder != 'none'
        run: uv build
