name: Dev (feature push)

on:
  # Validate direct pushes to development branches.
  push:
    branches-ignore: [main]

concurrency:
  group: dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commit messages
    uses: ./.github/workflows/commit-messages.yml

  quality:
    name: Quality checks
    uses: ./.github/workflows/quality.yml
    with:
      python-versions: '["3.12"]'
      base-sha: ${{ github.event.before }}
      head-sha: ${{ github.sha }}
